[build]
  base = "/"
  command = "node scripts/build-demo.cjs"
  publish = "dist"

[[redirects]]
  from = "/rumah"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/rumah/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tentang"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200
