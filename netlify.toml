[build]
  base = "/"
  command = "node scripts/build-netlify.cjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/api/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/rumah"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/rumah/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tentang"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/masuk"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/daftar"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/akun"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/akun/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"

[[headers]]
  for = "/assets/deployment.js"
  [headers.values]
    Cache-Control = "no-cache"
